# VERSION 이 바뀐 채 main 에 들어오면 그 버전의 태그·릴리즈를 만든다.
#
# 왜: 소비자의 동기화(`claude-ops sync --ref latest`)와 동기화 PR 워크플로는 **태그**로 최신 판을 찾는다.
# 태그를 사람이 손으로 붙이면 빠뜨리기 쉽고, 에이전트 세션의 git 연결은 태그 푸시를 막는 경우가 있다
# (실측 — 브랜치 푸시는 되고 태그 푸시는 연결이 끊겼다). 그래서 버전을 올리는 PR 이 머지되는 순간
# 이 저장소의 Actions 가 직접 붙인다. 이미 있는 태그는 건드리지 않는다(같은 버전을 다시 내지 않는다).
#
# 버전을 내는 법: VERSION 과 CHANGELOG.md 를 같은 PR 에서 올리고 머지한다. 그 밖에 할 일은 없다.
name: tag-release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: VERSION 의 태그가 없으면 만든다
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d ' \r\n' < VERSION)
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION 이 x.y.z 형식이 아니다: '$V'" >&2; exit 1
          fi
          T="v$V"
          if gh api "repos/${{ github.repository }}/git/ref/tags/$T" >/dev/null 2>&1; then
            echo "$T 는 이미 있다 — 건너뜀" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # CHANGELOG 의 그 버전 절을 릴리즈 본문으로(없으면 한 줄)
          awk -v v="$V" '
            $0 ~ "^## "v"( |$)" { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "버전 $V" > notes.md
          gh release create "$T" --target "${{ github.sha }}" --title "$T" --notes-file notes.md
          echo "$T 를 ${{ github.sha }} 에 붙였다" >> "$GITHUB_STEP_SUMMARY"
