# claude-ops 동기화 — 템플릿의 최신 태그를 받아 바뀌었으면 PR 을 연다(Dependabot 과 같은 모양).
#
# 기본은 **수동 실행만**(Actions → 「claude-ops sync」 → Run workflow) — 템플릿에 새 태그가 나와 받고 싶을 때 돌린다.
# 주기 실행은 선택이다: 템플릿이 자주 바뀌고 놓치지 않고 받고 싶으면 아래 on: 에
#   schedule:
#     - cron: '23 1 * * 1'   # 매주 월요일 01:23 UTC
# 를 더한다(바뀐 것이 없으면 PR 을 만들지 않는다). PR 의 CI(claude-ops check · 이 저장소의 CI)가 검증하고, 머지는 사람이 한다.
#
# 템플릿 접근: 공개 저장소면 토큰 없이 익명으로 받는다. 비공개로 바뀌면 저장소 시크릿 CLAUDE_OPS_TOKEN
# (템플릿 읽기 권한)을 넣는다 — 있으면 쓰고 없어도 동작한다.
#
# 알아 둘 GitHub 제약 두 가지:
#   · GITHUB_TOKEN 으로 만든 PR·푸시는 **다른 워크플로를 깨우지 않는다**(무한 루프 방지 규칙). 그래서
#     CLAUDE_OPS_TOKEN(이 저장소에 contents·pull-requests 쓰기 권한도 있는 토큰)이 없으면 PR 의 CI 가 자동으로
#     돌지 않는다 — PR 을 닫았다 다시 열거나, 수동으로 검사 워크플로를 실행한다. PR 본문에 그 안내를 넣는다.
#   · GITHUB_TOKEN 으로 PR 을 만들려면 저장소 설정 Actions → General → 「Allow GitHub Actions to create and
#     approve pull requests」 가 켜져 있어야 한다.
#
# 이 파일은 `claude-ops init` 이 한 번 만든 오버레이다(템플릿 sync 가 덮지 않는다).
name: claude-ops sync

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '템플릿 ref — latest(가장 높은 vX.Y.Z 태그) · 태그 · 브랜치 · 커밋'
        required: false
        default: latest

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: claude-ops-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CLAUDE_OPS_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 템플릿 받기 · 관리 파일 갱신
        env:
          CLAUDE_OPS_TOKEN: ${{ secrets.CLAUDE_OPS_TOKEN }}
          REF: ${{ inputs.ref || 'latest' }}
        run: node .claude/ops/bin/claude-ops.js sync --ref "$REF"

      - name: 바뀌었으면 PR
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_OPS_TOKEN || github.token }}
          HAS_PAT: ${{ secrets.CLAUDE_OPS_TOKEN != '' }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "관리 파일 변경 없음 — PR 을 만들지 않는다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          VER=$(node -e 'const l=JSON.parse(require("fs").readFileSync(".claude/ops.lock","utf8"));process.stdout.write(String(l.source.version||l.source.commit.slice(0,12)))')
          BR="claude-ops/sync-v$VER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add -A .claude
          git commit -q -m "claude-ops 템플릿 동기화 → v$VER" -m "자동 동기화(claude-ops-sync). 관리 파일만 바뀐다 — 오버레이(CLAUDE.md · project.env · settings.overlay.json)는 그대로."
          git push -q --force origin "HEAD:refs/heads/$BR"
          OPEN=$(gh pr list --head "$BR" --state open --json number --jq 'length')
          if [ "$OPEN" = "0" ]; then
            NOTE=""
            if [ "$HAS_PAT" != "true" ]; then
              NOTE=$'\n\n> 이 PR 은 GITHUB_TOKEN 으로 만들어져 다른 워크플로(CI)가 자동으로 돌지 않았을 수 있다. 닫았다 다시 열거나 검사 워크플로를 수동 실행한다.'
            fi
            gh pr create --base "$BASE" --head "$BR" --title "claude-ops 템플릿 동기화 → v$VER" \
              --body "템플릿의 관리 파일을 v$VER 로 맞춘다. 무엇이 바뀌었는지는 템플릿의 CHANGELOG.md 를 본다.${NOTE}"
          fi
          echo "PR 브랜치 $BR (v$VER)" >> "$GITHUB_STEP_SUMMARY"
